name: Maintenance

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

concurrency:
  group: maintenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fresh-deps-check:
    name: Fresh Dependencies & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Resolve latest compatible dependencies & test
        run: |
          cargo test
          cargo build --release
          ./target/release/agy-tui --version
