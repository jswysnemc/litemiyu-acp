name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (x86_64)
            os: ubuntu-latest
            bin: target/release/litemiyu-acp
          - name: Windows (x86_64)
            os: windows-latest
            bin: target/release/litemiyu-acp.exe
          - name: macOS (arm64)
            os: macos-latest
            bin: target/release/litemiyu-acp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-${{ matrix.os }}
          cache-on-failure: true

      - name: Run unit tests
        run: cargo test --verbose

      - name: Build release binary
        run: cargo build --release

      - name: Smoke test binary
        shell: bash
        run: |
          set -euo pipefail
          test -f "${{ matrix.bin }}"
          "${{ matrix.bin }}" --version
          "${{ matrix.bin }}" --help >/dev/null
