name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v0.1.0). Leave empty to use current ref."
        required: false
        type: string
      publish:
        description: "Create or update GitHub Release (tag pushes always publish)."
        type: boolean
        default: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: litemiyu-acp-windows-x86_64
            ext: .exe
            archive: zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: litemiyu-acp-linux-x86_64
            ext: ""
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: litemiyu-acp-linux-aarch64
            ext: ""
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: litemiyu-acp-macos-arm64
            ext: ""
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: litemiyu-acp-macos-x86_64
            ext: ""
            archive: tar.gz
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}

      - name: Run unit tests (native target)
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo test

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package release archive
        shell: bash
        run: |
          set -euo pipefail
          stage="dist/${{ matrix.asset }}"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/litemiyu-acp${{ matrix.ext }}" "$stage/litemiyu-acp${{ matrix.ext }}"
          cp README.md LICENSE "$stage/"
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            pwsh -NoProfile -Command "Compress-Archive -Path '$stage/*' -DestinationPath 'dist/${{ matrix.asset }}.zip' -Force"
            out_file="${{ matrix.asset }}.zip"
          else
            chmod +x "$stage/litemiyu-acp"
            tar -C "$stage" -czf "dist/${{ matrix.asset }}.tar.gz" .
            out_file="${{ matrix.asset }}.tar.gz"
          fi
          rm -rf "$stage"
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "$out_file" > "$out_file.sha256")
          else
            (cd dist && shasum -a 256 "$out_file" > "$out_file.sha256")
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}.${{ matrix.archive }}
            dist/${{ matrix.asset }}.${{ matrix.archive }}.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [build]
    if: github.event_name == 'push' || inputs.publish || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          pattern: litemiyu-acp-*

      - name: Generate combined SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          cat *.sha256 | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Resolve tag name
        id: tag
        run: |
          if [[ -n "${{ inputs.tag }}" ]]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: litemiyu-acp ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.name, '-') }}
          files: dist/*
